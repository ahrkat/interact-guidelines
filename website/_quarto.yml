project:
  type: website
  output-dir: _site
  # Only render the site pages, never templates or examples elsewhere in the repo
  render:
    - "*.qmd"

website:
  title: "How to submit to the Methods"
  site-url: "https://YOUR-ORG.github.io/YOUR-REPO/"
  repo-url: "https://github.com/YOUR-ORG/YOUR-REPO"
  repo-actions: [edit, issue]
  search: true
  page-navigation: true
  navbar:
    right:
      - text: "Methods Hub"
        href: https://methodshub.gesis.org
  sidebar:
    style: docked
    search: false
    contents:
      - index.qmd
      - scope.qmd
      - criteria.qmd
      - tips.qmd 
      - checklist.qmd
      - faq.qmd
      - support.qmd
  page-footer:
    left: "[methodshub.gesis.org](https://methodshub.gesis.org)"
    right: "[methodshub@gesis.org](mailto:methodshub@gesis.org)"

format:
  html:
    theme: [cosmo, gesis.scss]
    css: styles.css
    toc: true
    toc-location: right
    toc-title: "Content"
    toc-depth: 3
    number-sections: false
    link-external-newwindow: true
